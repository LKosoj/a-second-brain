[project]
name = "a-second-brain"
version = "0.1.0"
description = "Voice-first personal assistant for Telegram with Obsidian and Todoist integration"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "A Second Brain contributors" }]
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.30,<4",
    "deepgram-sdk>=7.6,<8",
    "httpx",
    "jpype1>=1.7.0",
    "markitdown[docx,pdf,pptx,xlsx]>=0.1.0",
    "openai>=1.99.1",
    "pydantic>=2.0",
    "pydantic-settings",
    "python-dotenv>=1,<2",
    "PyYAML>=6.0.2",
    "todoist-api-python>=3.1.0",
    "yt-dlp>=2025.3.31",
]

[project.scripts]
a-second-brain = "d_brain.cli:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "d_brain"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["^src/d_brain/resources/project_template/skills/"]

[[tool.mypy.overrides]]
module = ["openpyxl", "pypdfium2"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0",
    "ruff>=0.14.14",
    "types-PyYAML>=6.0.12.20250915",
]
