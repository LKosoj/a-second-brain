[project]
name = "a-second-brain"
version = "0.2.0"
description = "Voice-first personal assistant for Telegram with Obsidian and Todoist integration"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "A Second Brain contributors" }]
requires-python = ">=3.14,<3.15"
dependencies = [
    "agent-client-protocol>=1.1.0,<2",
    "aiogram>=3.34.0,<4",
    "deepgram-sdk>=7.19.0,<8",
    "httpx>=0.29.0,<1",
    "markdown>=3.11.4,<4",
    "markitdown[docx,pdf,pptx,xlsx]>=0.1.9",
    # Not imported by the package: processor prompts (services/processor.py) ask
    # the agent to draw charts in the project environment.
    "matplotlib>=3.11.2,<4",
    "openai>=3.60.0,<4",
    "pydantic>=2.14.4,<3",
    "pydantic-settings>=2.16.3,<3",
    "python-dateutil>=4.0.0,<5",
    "python-dotenv>=1.2.4,<2",
    "PyYAML>=6.0.4,<7",
    "yt-dlp>=2026.11.23",
]

[project.optional-dependencies]
ms-project = ["jpype1>=1.7.1"]

[project.scripts]
a-second-brain = "d_brain.cli:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "d_brain"

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = ["src/d_brain/resources/project_template/skills/"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
exclude = ["^src/d_brain/resources/project_template/skills/"]

[[tool.mypy.overrides]]
module = ["dateutil", "dateutil.*", "openpyxl", "pypdfium2"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "fixture-scope"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "types-Markdown>=3.11.4.20261128",
    "types-PyYAML>=6.0.12.20261122",
]
