name: Quality

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.26"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen --group dev

      - name: Ruff
        run: uv run --frozen ruff check .

      - name: Ruff (project template skills, informational)
        continue-on-error: true
        run: uv run --frozen ruff check --isolated --select E,F,B src/d_brain/resources/project_template/skills

      - name: Mypy
        run: uv run --frozen mypy src

      - name: Tests
        run: uv run --frozen pytest -q

      - name: Shellcheck
        run: shellcheck install.sh scripts/*.sh scripts/lib/*.sh

      - name: Dependency audit
        run: |
          uv export --frozen --no-hashes --no-emit-project --format requirements-txt \
            -o "${{ runner.temp }}/requirements-audit.txt"
          uvx pip-audit --strict -r "${{ runner.temp }}/requirements-audit.txt"

      - name: Build
        run: uv build

      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
